name: Orchestrated Auto-Pilot CLI
# Regression flows for scripts/auto-pilot.mjs orchestrate/observe.

flows:
  - name: "orchestrate: PLAN_EMPTY exits non-zero"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        mkdir -p "$tmpdir/.va-auto-pilot" "$tmpdir/docs/todo"
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {"projectPrefix":"AP","tasks":[{"id":"AP-001","title":"done","priority":"P1","state":"Done","dependsOn":[]}]}
        EOF
        cat > "$tmpdir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions

        EOF
        repo="$(cd "$ROOT" && pwd)"
        cd "$tmpdir"
        node "$repo/scripts/auto-pilot.mjs" orchestrate init --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate plan --json 2>&1 | grep -q PLAN_EMPTY
    env:
      ROOT: "."
    assert:
      must:
        - exit_code_nonzero: true
      should: []

  - name: "orchestrate: plan blocked on terminated run"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        mkdir -p "$tmpdir/.va-auto-pilot/orchestration" "$tmpdir/docs/todo"
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {"projectPrefix":"AP","tasks":[{"id":"AP-001","title":"t","priority":"P1","state":"Backlog","dependsOn":[]}]}
        EOF
        cat > "$tmpdir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions

        EOF
        cat > "$tmpdir/.va-auto-pilot/orchestration/run.json" <<'EOF'
        {"schemaVersion":1,"runId":"run-test","phase":"done","locks":{"executorPid":null}}
        EOF
        repo="$(cd "$ROOT" && pwd)"
        cd "$tmpdir"
        node "$repo/scripts/auto-pilot.mjs" orchestrate plan --json 2>&1 | grep -q RUN_TERMINATED
    env:
      ROOT: "."
    assert:
      must:
        - exit_code_nonzero: true
      should: []

  - name: "orchestrate: dry-run await-workers uses dry-run-preview phase"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        mkdir -p "$tmpdir/.va-auto-pilot" "$tmpdir/docs/todo"
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {"projectPrefix":"AP","tasks":[{"id":"AP-001","title":"t","priority":"P1","state":"Backlog","dependsOn":[]}]}
        EOF
        cat > "$tmpdir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions

        EOF
        repo="$(cd "$ROOT" && pwd)"
        cd "$tmpdir"
        node "$repo/scripts/auto-pilot.mjs" orchestrate init --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate plan --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate review-plan --dry-run --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate approve-plan --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate dispatch --json >/dev/null
        out="$(node "$repo/scripts/auto-pilot.mjs" orchestrate await-workers --dry-run --json)"
        echo "$out" | grep -q '"phase": "dry-run-preview"'
        node "$repo/scripts/auto-pilot.mjs" observe --json | node -e "const j=JSON.parse(require('fs').readFileSync(0,'utf8'));process.exit((j.snapshot?.anomalies?.length??0)===0?0:1)"
    env:
      ROOT: "."
    assert:
      must:
        - exit_code: 0
      should: []

  - name: "orchestrate: approve-plan blocked without review-plan"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        mkdir -p "$tmpdir/.va-auto-pilot" "$tmpdir/docs/todo"
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {"projectPrefix":"AP","tasks":[{"id":"AP-001","title":"t","priority":"P1","state":"Backlog","dependsOn":[]}]}
        EOF
        cat > "$tmpdir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions

        EOF
        repo="$(cd "$ROOT" && pwd)"
        cd "$tmpdir"
        node "$repo/scripts/auto-pilot.mjs" orchestrate init --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate plan --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate approve-plan --json 2>&1 | grep -q PLAN_REVIEW_REQUIRED
    env:
      ROOT: "."
    assert:
      must:
        - exit_code_nonzero: true
      should: []

  - name: "orchestrate: review-plan dry-run then approve-plan"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        mkdir -p "$tmpdir/.va-auto-pilot" "$tmpdir/docs/todo"
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {"projectPrefix":"AP","tasks":[{"id":"AP-001","title":"t","priority":"P1","state":"Backlog","dependsOn":[]}]}
        EOF
        cat > "$tmpdir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions

        EOF
        repo="$(cd "$ROOT" && pwd)"
        cd "$tmpdir"
        node "$repo/scripts/auto-pilot.mjs" orchestrate init --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate plan --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate review-plan --dry-run --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate approve-plan --json >/dev/null
    env:
      ROOT: "."
    assert:
      must:
        - exit_code: 0
      should: []

  - name: "goal-to-backlog: plan-from-goal applies candidate backlog and marks intent handled"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        mkdir -p "$tmpdir/.va-auto-pilot" "$tmpdir/docs/todo"
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {"projectPrefix":"AP","tasks":[]}
        EOF
        cat > "$tmpdir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions

        EOF
        cat > "$tmpdir/docs/todo/run-journal.md" <<'EOF'
        # Run Journal

        EOF
        repo="$(cd "$ROOT" && pwd)"
        cd "$tmpdir"
        node "$repo/scripts/auto-pilot.mjs" goal --text "Make goal-to-backlog explicit" --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" plan-from-goal --json \
          | node -e "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); process.exit(j.candidateBacklog?.items?.[0]?.title==='Make goal-to-backlog explicit'?0:1)"
        node "$repo/scripts/auto-pilot.mjs" plan-from-goal --apply --json \
          | node -e "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); process.exit(j.applied===true && j.appliedTasks?.[0]?.id==='AP-001'?0:1)"
        grep -q 'AP-001' "$tmpdir/.va-auto-pilot/sprint-state.json"
        grep -q -- '- \[x\] \[objective\] Make goal-to-backlog explicit' "$tmpdir/docs/todo/human-board.md"
    env:
      ROOT: "."
    assert:
      must:
        - exit_code: 0
      should: []

  - name: "orchestrate: plan auto converts objective intent into candidate backlog"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        mkdir -p "$tmpdir/.va-auto-pilot" "$tmpdir/docs/todo"
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {"projectPrefix":"AP","tasks":[]}
        EOF
        cat > "$tmpdir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions

        EOF
        cat > "$tmpdir/docs/todo/run-journal.md" <<'EOF'
        # Run Journal

        EOF
        repo="$(cd "$ROOT" && pwd)"
        cd "$tmpdir"
        node "$repo/scripts/auto-pilot.mjs" goal --text "Create a visible reviewed plan path" --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate init --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate plan --json \
          | node -e "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); process.exit(j.goalToBacklog?.applied===true && j.candidatePlan?.primaryTaskId==='AP-001'?0:1)"
    env:
      ROOT: "."
    assert:
      must:
        - exit_code: 0
      should: []

  - name: "approvalPolicy: review-plan can auto approve low-risk trusted plan"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        mkdir -p "$tmpdir/.va-auto-pilot" "$tmpdir/docs/todo"
        cat > "$tmpdir/.va-auto-pilot/config.yaml" <<'EOF'
        version: 1
        qualityGate:
          buildCommand: 'node -e "process.exit(0)"'
          reviewCommand: 'node -e "console.log(''REVIEW STATUS: PASS'')"'
          acceptanceTestCommand: 'node -e "process.exit(0)"'
        approvalPolicy:
          smallRefactor: auto-if-gates-trusted
        EOF
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {"projectPrefix":"AP","tasks":[{"id":"AP-001","title":"tidy small helper","priority":"P2","state":"Backlog","dependsOn":[]}]}
        EOF
        cat > "$tmpdir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions

        EOF
        cat > "$tmpdir/docs/todo/run-journal.md" <<'EOF'
        # Run Journal

        EOF
        repo="$(cd "$ROOT" && pwd)"
        cd "$tmpdir"
        node "$repo/scripts/auto-pilot.mjs" orchestrate init --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate plan --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate review-plan --dry-run --json \
          | node -e "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); process.exit(j.phase==='plan-approved' && j.approvalPolicy?.autoApproved===true?0:1)"
    env:
      ROOT: "."
    assert:
      must:
        - exit_code: 0
      should: []

  - name: "worktreeIsolation: dispatch maps each track to .va/worktrees"
    command: "bash"
    timeout_ms: 30000
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        mkdir -p "$tmpdir/.va-auto-pilot" "$tmpdir/docs/todo"
        cat > "$tmpdir/.gitignore" <<'EOF'
        .va/worktrees/
        EOF
        cat > "$tmpdir/.va-auto-pilot/config.yaml" <<'EOF'
        version: 1
        qualityGate:
          buildCommand: 'node -e "process.exit(0)"'
          reviewCommand: 'node -e "console.log(''REVIEW STATUS: PASS'')"'
          acceptanceTestCommand: 'node -e "process.exit(0)"'
        worktreeIsolation:
          enabled: true
          rootDir: .va/worktrees
        EOF
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {"projectPrefix":"AP","tasks":[{"id":"AP-001","title":"isolated task","priority":"P1","state":"Backlog","dependsOn":[]}]}
        EOF
        cat > "$tmpdir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions

        EOF
        cat > "$tmpdir/docs/todo/run-journal.md" <<'EOF'
        # Run Journal

        EOF
        repo="$(cd "$ROOT" && pwd)"
        cd "$tmpdir"
        git init -q
        git config user.email wt@example.invalid
        git config user.name "Worktree Test"
        git add .
        git commit -q -m "seed"
        node "$repo/scripts/auto-pilot.mjs" orchestrate init --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate plan --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate review-plan --dry-run --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate approve-plan --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate dispatch --json \
          | node -e "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); process.exit(j.worktreeIsolation?.tracks?.[0]?.worktree?.path?.includes('.va/worktrees/AP-001')?0:1)"
        test -d "$tmpdir/.va/worktrees/AP-001"
    env:
      ROOT: "."
    assert:
      must:
        - exit_code: 0
      should: []

  - name: "orchestrate: stale checkpoint blocks sprint-state human-board and git-head drift"
    command: "bash"
    timeout_ms: 30000
    args:
      - "-lc"
      - |
        set -euo pipefail
        repo="$(cd "$ROOT" && pwd)"
        evidence="$(mktemp -d)"

        setup_case() {
          local dir="$1"
          mkdir -p "$dir/.va-auto-pilot" "$dir/docs/todo"
          cat > "$dir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {"projectPrefix":"AP","tasks":[{"id":"AP-001","title":"governed task","priority":"P1","state":"Backlog","dependsOn":[],"failCount":0}]}
        EOF
          cat > "$dir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions

        EOF
          cat > "$dir/docs/todo/run-journal.md" <<'EOF'
        # Run Journal

        EOF
          echo "seed" > "$dir/seed.txt"
          (cd "$dir" && node "$repo/scripts/sprint-board.mjs" render >/dev/null)
          (cd "$dir" && git init -q && git config user.email stale@example.invalid && git config user.name "Stale Checkpoint" && git add . && git commit -q -m "chore: seed")
        }

        approve_case() {
          local dir="$1"
          (cd "$dir" && node "$repo/scripts/auto-pilot.mjs" orchestrate init --json >/dev/null)
          (cd "$dir" && node "$repo/scripts/auto-pilot.mjs" orchestrate plan --json >/dev/null)
          (cd "$dir" && node "$repo/scripts/auto-pilot.mjs" orchestrate review-plan --dry-run --json >/dev/null)
          (cd "$dir" && node "$repo/scripts/auto-pilot.mjs" orchestrate approve-plan --json >/dev/null)
        }

        assert_stale_dispatch() {
          local dir="$1"
          local name="$2"
          local reason="$3"
          local out="$evidence/$name-dispatch.txt"
          if (cd "$dir" && node "$repo/scripts/auto-pilot.mjs" orchestrate dispatch --json > "$out" 2>&1); then
            echo "dispatch unexpectedly succeeded for $name" >&2
            exit 1
          fi
          grep -q "STALE_CONTEXT" "$out"
          grep -q "$reason" "$out"
          grep -q "checkpoint.stale" "$dir/.va-auto-pilot/evidence/events.jsonl"
          grep -q "$reason" "$dir/.va-auto-pilot/evidence/events.jsonl"
        }

        sprint_dir="$(mktemp -d)"
        setup_case "$sprint_dir"
        approve_case "$sprint_dir"
        node - <<'NODE' "$sprint_dir/.va-auto-pilot/sprint-state.json"
        const fs = require('fs');
        const stateFile = process.argv[2];
        const state = JSON.parse(fs.readFileSync(stateFile, 'utf8'));
        state.tasks[0].failCount = 1;
        fs.writeFileSync(stateFile, `${JSON.stringify(state, null, 2)}\n`);
        NODE
        assert_stale_dispatch "$sprint_dir" "sprint-state" "sprint-state changed since approve-plan"

        human_dir="$(mktemp -d)"
        setup_case "$human_dir"
        approve_case "$human_dir"
        cat >> "$human_dir/docs/todo/human-board.md" <<'EOF'
        - [ ] Re-check the plan before dispatch
        EOF
        assert_stale_dispatch "$human_dir" "human-board" "human intent changed since approve-plan"

        git_dir="$(mktemp -d)"
        setup_case "$git_dir"
        approve_case "$git_dir"
        (cd "$git_dir" && echo "changed" >> seed.txt && git add seed.txt && git commit -q -m "chore: move head")
        assert_stale_dispatch "$git_dir" "git-head" "git HEAD changed since approve-plan"
    env:
      ROOT: "."
    assert:
      must:
        - exit_code: 0
      should: []

  - name: "orchestrate: full governed cycle commits deterministic worker output"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        evidence="$(mktemp -d)"
        mkdir -p "$tmpdir/.va-auto-pilot" "$tmpdir/docs/todo"
        cat > "$tmpdir/.gitignore" <<'EOF'
        .va-auto-pilot/orchestration/
        .va-auto-pilot/parallel-runs/
        EOF
        cat > "$tmpdir/.va-auto-pilot/config.yaml" <<'EOF'
        version: 1
        projectPrefix: AP
        sprint:
          stateFile: .va-auto-pilot/sprint-state.json
          boardFile: docs/todo/sprint.md
          runJournalFile: docs/todo/run-journal.md
        qualityGate:
          buildCommand: test -f AP-001.txt
          reviewCommand: /bin/echo REVIEW_STATUS_PASS
          acceptanceTestCommand: test -f AP-001.txt
          planReviewCommand: "/bin/echo WARNING: dogfood-plan-reviewed"
        EOF
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {
          "projectPrefix": "AP",
          "tasks": [
            {
              "id": "AP-001",
              "title": "Write deterministic dogfood artifact",
              "priority": "P0",
              "state": "Backlog",
              "owner": "",
              "source": "orchestrated-dogfood-fixture",
              "createdAt": "2026-07-01",
              "startedAt": "",
              "completedAt": "",
              "lastFailedAt": "",
              "failCount": 0,
              "reason": "",
              "verification": "AP-001.txt exists and is committed after explicit approve-commit",
              "notes": "Worker must create AP-001.txt; gates must verify the file exists.",
              "permissionPolicy": {
                "schemaVersion": 1,
                "fileScopes": [
                  {"path": "AP-001.txt", "access": "read-write", "reason": "worker artifact"},
                  {"path": "AP-001-prompt.txt", "access": "read-write", "reason": "runtime prompt capture"}
                ],
                "commands": {"allow": [], "deny": [], "destructiveRequiresOptIn": true, "destructiveAllow": []},
                "network": {"mode": "none", "allowlist": []},
                "review": {"warnOnOutOfScopeDiff": true}
              },
              "review": {},
              "testing": {},
              "dependsOn": []
            }
          ]
        }
        EOF
        cat > "$tmpdir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions

        EOF
        cat > "$tmpdir/docs/todo/run-journal.md" <<'EOF'
        # Run Journal

        EOF
        external_journal="$evidence/external-run-journal.md"
        cat > "$external_journal" <<'EOF'
        # External Run Journal

        EOF
        repo="$(cd "$ROOT" && pwd)"
        cd "$tmpdir"
        node "$repo/scripts/sprint-board.mjs" render >/dev/null
        git init -q
        git config user.email dogfood@example.invalid
        git config user.name "VA Auto-Pilot Dogfood"
        git add .
        git commit -q -m "chore: seed dogfood fixture"

        node "$repo/scripts/auto-pilot.mjs" orchestrate init --manager-surface codex --json > "$evidence/init.json"
        node "$repo/scripts/auto-pilot.mjs" orchestrate plan --max-parallel 1 --json > "$evidence/plan.json"
        node "$repo/scripts/auto-pilot.mjs" observe --json > "$evidence/observe-after-plan.json"
        node "$repo/scripts/auto-pilot.mjs" orchestrate review-plan --json > "$evidence/review-plan.json"
        node "$repo/scripts/auto-pilot.mjs" observe --json > "$evidence/observe-after-review.json"
        node "$repo/scripts/auto-pilot.mjs" orchestrate approve-plan --json > "$evidence/approve-plan.json"
        node "$repo/scripts/auto-pilot.mjs" orchestrate dispatch --json > "$evidence/dispatch.json"
        node "$repo/scripts/auto-pilot.mjs" observe --json > "$evidence/observe-after-dispatch.json"
        AGENT_CAPTURE_PROMPT=1 node "$repo/scripts/auto-pilot.mjs" orchestrate await-workers --no-colony --agent-template "node $repo/e2e/stubs/deterministic-agent.mjs" > "$evidence/await-workers.log"
        node "$repo/scripts/auto-pilot.mjs" observe --json > "$evidence/observe-after-await.json"
        node "$repo/scripts/auto-pilot.mjs" orchestrate approve-commit --tasks AP-001 --json > "$evidence/approve-commit.json"
        node "$repo/scripts/auto-pilot.mjs" orchestrate commit --json > "$evidence/commit.json"
        node "$repo/scripts/auto-pilot.mjs" orchestrate journal --journal-file "$external_journal" --json > "$evidence/journal.json"
        git log --oneline --decorate -3 > "$evidence/git-log.txt"
        git status --short > "$evidence/git-status.txt"
        git ls-files .va-auto-pilot/orchestration/run.json .va-auto-pilot/orchestration/snapshot.json > "$evidence/tracked-control-files.txt"
        git ls-files .va-auto-pilot/evidence > "$evidence/tracked-evidence-files.txt"
        find .va-auto-pilot -maxdepth 4 -type f | sort > "$evidence/control-files.txt"

        node - <<'NODE' "$evidence" "$tmpdir"
        const fs = require('fs');
        const path = require('path');
        const evidence = process.argv[2];
        const tmpdir = process.argv[3];
        const read = (name) => JSON.parse(fs.readFileSync(path.join(evidence, name), 'utf8'));
        const text = (name) => fs.readFileSync(path.join(evidence, name), 'utf8');
        const assert = (condition, message) => {
          if (!condition) throw new Error(message);
        };

        assert(read('plan.json').candidatePlan.primaryTaskId === 'AP-001', 'plan did not select AP-001');
        assert(read('review-plan.json').review.passed === true, 'plan review did not pass');
        assert(read('review-plan.json').review.command === '/bin/echo WARNING: dogfood-plan-reviewed', 'plan review command did not come from fixture config');
        assert(read('approve-plan.json').checkpoint.observability.eventLogPath.endsWith('.va-auto-pilot/evidence/events.jsonl'), 'checkpoint event log path missing');
        assert(read('approve-plan.json').checkpoint.observability.evidenceBundleDir.endsWith('.va-auto-pilot/evidence'), 'checkpoint evidence bundle dir missing');
        assert(read('dispatch.json').queuedTasks.includes('AP-001'), 'dispatch did not queue AP-001');
        assert(read('observe-after-await.json').snapshot.run.phase === 'awaiting-commit-approval', 'observe after await did not show awaiting-commit-approval');
        assert(read('approve-commit.json').approvedCommitTasks.includes('AP-001'), 'commit approval missing AP-001');
        assert(read('commit.json').commits.some((item) => item.taskId === 'AP-001' && item.ok === true && item.hash), 'commit output missing AP-001 hash');
        assert(read('journal.json').phase === 'cycle-closed', 'journal did not close cycle');
        assert(read('journal.json').journalCommit.committed === true, 'journal control commit was not created');
        assert(!read('journal.json').journalCommit.files.some((file) => file.includes('..')), 'external journal leaked into git pathspecs');
        assert(text('tracked-control-files.txt').includes('.va-auto-pilot/orchestration/run.json'), 'ignored run.json was not force-added');
        assert(text('tracked-control-files.txt').includes('.va-auto-pilot/orchestration/snapshot.json'), 'ignored snapshot.json was not force-added');
        assert(fs.readFileSync(path.join(evidence, 'external-run-journal.md'), 'utf8').includes('cycle-boundary'), 'external journal was not updated');

        const awaitLog = text('await-workers.log');
        assert(awaitLog.includes('gate "build" PASSED'), 'build gate output missing');
        assert(awaitLog.includes('gate "review" PASSED'), 'review gate output missing');
        assert(awaitLog.includes('gate "acceptance" PASSED'), 'acceptance gate output missing');

        const eventsLog = path.join(tmpdir, '.va-auto-pilot/evidence/events.jsonl');
        assert(fs.existsSync(eventsLog), 'events log missing');
        const events = fs.readFileSync(eventsLog, 'utf8');
        assert(events.includes('plan.approved'), 'plan approval event missing');
        assert(events.includes('dispatch.queued'), 'dispatch event missing');
        assert(events.includes('task.started'), 'task started event missing');
        assert(events.includes('task.command'), 'task command event missing');
        assert(events.includes('task.gate'), 'task gate event missing');
        assert(events.includes('task.completed'), 'task completed event missing');
        assert(events.includes('journal'), 'journal event missing');
        const runId = read('approve-plan.json').runId;
        const bundleDir = path.join(tmpdir, '.va-auto-pilot/evidence', runId, 'AP-001');
        const manifestPath = path.join(bundleDir, 'manifest.json');
        assert(fs.existsSync(manifestPath), 'task evidence bundle manifest missing');
        const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
