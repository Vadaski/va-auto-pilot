name: Auto-Pilot Loop CLI
# Regression flow for scripts/auto-pilot-loop.mjs.

flows:
  - name: "loop: injects human-board instructions without blocking"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        mkdir -p "$tmpdir/.va-auto-pilot" "$tmpdir/docs/todo"
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {
          "projectPrefix": "AP",
          "updatedAt": "2026-01-01T00:00:00.000Z",
          "tasks": [
            {
              "id": "AP-001",
              "title": "Smoke task",
              "priority": "P1",
              "state": "Backlog",
              "dependsOn": []
            }
          ]
        }
        EOF
        cat > "$tmpdir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions

        - [ ] handle this first
        EOF
        AUTO_PILOT_SPRINT_STATE_FILE="$tmpdir/.va-auto-pilot/sprint-state.json" node scripts/auto-pilot-loop.mjs --dry-run --max-cycles 1
    assert:
      must:
        - exit_code: 0
        - stdout_contains:
            - "human-board instruction(s) injected into delegate prompt"
            - "[dry-run] injected human-board instructions:"
            - "handle this first"
        - stdout_not_contains: ["HUMAN_BOARD_BLOCKED", "sprint-complete"]
      should: []
