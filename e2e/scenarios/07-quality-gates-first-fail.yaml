name: "Quality Gates: Build Failure Blocks Sequence"
description: |
  When the build gate fails, the task should go to Failed state
  and no further gates should run.

setup:
  fixture: minimal-node
  agent_behavior: pass
  sprint_state:
    projectPrefix: E2E
    tasks:
      - id: E2E-001
        title: "Write hello function"
        priority: P1
        state: Backlog
        dependsOn: []
  pitfalls:
    entries: []
  config: |
    version: 1
    projectPrefix: E2E
    sprint:
      stateFile: .va-auto-pilot/sprint-state.json
      boardFile: docs/todo/sprint.md
      runJournalFile: docs/todo/run-journal.md
    qualityGate:
      buildCommand: "false"
      reviewCommand: "touch review-gate-ran.txt"
      acceptanceTestCommand: "touch acceptance-gate-ran.txt"
    review:
      domainRoleName: E2E Reviewer
      domainPrompt: "E2E test reviewer"

run:
  args: ["scripts/auto-pilot-loop.mjs"]
  flags: ["--no-colony", "--no-commit", "--no-parallel", "--max-cycles", "1", "--skip-sprint-review"]

assert:
  must:
    - type: exit_code
      value: 0
    - type: gate_failed
      gate: build
    - type: gate_not_run
      gate: review
    - type: gate_not_run
      gate: acceptance
    - type: state_after
      task: E2E-001
      field: state
      value: Failed
    - type: task_field
      task: E2E-001
      field: failCount
      value: 1
    - type: file_not_exists
      path: review-gate-ran.txt
    - type: file_not_exists
      path: acceptance-gate-ran.txt
  should: []
