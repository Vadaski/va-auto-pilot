name: Sprint Board CLI
# CLI flows executed by scripts/test-cli-flows.mjs.
# Flows that mutate state use isolated_state: true to get a temporary copy
# of the sprint state file, preventing pollution of the real sprint state.

flows:
  - name: "add: creates task with sequential ID"
    command: "node"
    args: ["scripts/sprint-board.mjs", "add", "--title", "Smoke task", "--priority", "P2"]
    isolated_state: true
    assert:
      must:
        - exit_code: 0
        - stdout_contains: ["Task added"]
      should:
        - stdout_contains: ["AP-"]

  - name: "add: rejects invalid priority"
    command: "node"
    args: ["scripts/sprint-board.mjs", "add", "--title", "Bad", "--priority", "PX"]
    isolated_state: true
    assert:
      must:
        - exit_code_nonzero: true
        - stderr_contains: ["Invalid priority"]
      should: []

  - name: "update: transitions task state"
    command: "node"
    args: ["scripts/sprint-board.mjs", "update", "--id", "AP-004", "--state", "In Progress"]
    isolated_state: true
    assert:
      must:
        - exit_code: 0
        - stdout_contains: ["Task updated"]
      should:
        - stdout_contains: ["In Progress"]

  - name: "update: rejects unknown task ID"
    command: "node"
    args: ["scripts/sprint-board.mjs", "update", "--id", "BOGUS-999", "--state", "Done"]
    isolated_state: true
    assert:
      must:
        - exit_code_nonzero: true
        - stderr_contains: ["Task not found"]
      should: []

  - name: "journal: appends entry"
    command: "node"
    args:
      - "scripts/sprint-board.mjs"
      - "journal"
      - "--task"
      - "AP-004"
      - "--summary"
      - "cli-flow test entry"
    isolated_journal: true
    assert:
      must:
        - exit_code: 0
        - stdout_contains: ["Journal updated"]
      should: []

  - name: "next: returns next actionable task"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        mkdir -p "$tmpdir/.va-auto-pilot" "$tmpdir/docs/todo"
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {
          "projectPrefix": "AP",
          "updatedAt": "2026-01-01T00:00:00.000Z",
          "tasks": [
            {
              "id": "AP-001",
              "title": "Smoke task",
              "priority": "P1",
              "state": "Backlog",
              "dependsOn": []
            }
          ]
        }
        EOF
        cat > "$tmpdir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions
        EOF
        AUTO_PILOT_SPRINT_STATE_FILE="$tmpdir/.va-auto-pilot/sprint-state.json" node scripts/sprint-board.mjs next
    assert:
      must:
        - exit_code: 0
        - stdout_not_empty: true
      should:
        - stdout_not_contains: ["Error:", "stack trace"]

  - name: "next --json: returns parseable JSON"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        mkdir -p "$tmpdir/.va-auto-pilot" "$tmpdir/docs/todo"
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {
          "projectPrefix": "AP",
          "updatedAt": "2026-01-01T00:00:00.000Z",
          "tasks": [
            {
              "id": "AP-001",
              "title": "Smoke task",
              "priority": "P1",
              "state": "Backlog",
              "dependsOn": []
            }
          ]
        }
        EOF
        cat > "$tmpdir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions
        EOF
        AUTO_PILOT_SPRINT_STATE_FILE="$tmpdir/.va-auto-pilot/sprint-state.json" node scripts/sprint-board.mjs next --json
    assert:
      must:
        - exit_code: 0
        - stdout_json_parseable: true
      should: []

  - name: "next with unprocessed instructions"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        mkdir -p "$tmpdir/.va-auto-pilot" "$tmpdir/docs/todo"
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {
          "projectPrefix": "AP",
          "updatedAt": "2026-01-01T00:00:00.000Z",
          "tasks": [
            {
              "id": "AP-001",
              "title": "Smoke task",
              "priority": "P1",
              "state": "Backlog",
              "dependsOn": []
            }
          ]
        }
        EOF
        cat > "$tmpdir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions

        - [ ] handle this first
        - [x] already handled
        EOF
        AUTO_PILOT_SPRINT_STATE_FILE="$tmpdir/.va-auto-pilot/sprint-state.json" node scripts/sprint-board.mjs next --json
    assert:
      must:
        - exit_code: 0
        - stdout_json_parseable: true
        - stdout_contains: ["human_board_instructions", "handle this first", "AP-001"]
      should: []

  - name: "next --strict with unprocessed instructions"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        mkdir -p "$tmpdir/.va-auto-pilot" "$tmpdir/docs/todo"
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {
          "projectPrefix": "AP",
          "updatedAt": "2026-01-01T00:00:00.000Z",
          "tasks": [
            {
              "id": "AP-001",
              "title": "Smoke task",
              "priority": "P1",
              "state": "Backlog",
              "dependsOn": []
            }
          ]
        }
        EOF
        cat > "$tmpdir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions

        - [ ] handle this first
        - [x] already handled
        EOF
        AUTO_PILOT_SPRINT_STATE_FILE="$tmpdir/.va-auto-pilot/sprint-state.json" node scripts/sprint-board.mjs next --json --strict
    assert:
      must:
        - exit_code_nonzero: true
        - stdout_json_parseable: true
        - stdout_contains: ["HUMAN_BOARD_BLOCKED", "handle this first"]
      should: []

  - name: "next: allows empty human-board Instructions"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        mkdir -p "$tmpdir/.va-auto-pilot" "$tmpdir/docs/todo"
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {
          "projectPrefix": "AP",
          "updatedAt": "2026-01-01T00:00:00.000Z",
          "tasks": [
            {
              "id": "AP-001",
              "title": "Smoke task",
              "priority": "P1",
              "state": "Backlog",
              "dependsOn": []
            }
          ]
        }
        EOF
        cat > "$tmpdir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions

        ## Feedback
        EOF
        AUTO_PILOT_SPRINT_STATE_FILE="$tmpdir/.va-auto-pilot/sprint-state.json" node scripts/sprint-board.mjs next --json
    assert:
      must:
        - exit_code: 0
        - stdout_json_parseable: true
      should:
        - stdout_not_contains: ["HUMAN_BOARD_BLOCKED"]

  - name: "summary: prints counts"
    command: "node"
    args: ["scripts/sprint-board.mjs", "summary"]
    assert:
      must:
        - exit_code: 0
        - stdout_contains: ["Sprint Summary", "Backlog", "Done"]
      should: []

  - name: "--help: exits 0 and prints usage"
    command: "node"
    args: ["scripts/sprint-board.mjs", "--help"]
    assert:
      must:
        - exit_code: 0
        - stdout_contains: ["Usage", "add", "update", "journal", "next"]
      should: []
