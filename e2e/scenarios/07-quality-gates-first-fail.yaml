name: "Quality Gates: Build Failure Blocks Sequence"
description: |
  When the build gate fails, the task should go to Failed state
  and no further gates should run.

setup:
  fixture: minimal-node
  agent_behavior: pass
  review_behavior: pass
  sprint_state:
    projectPrefix: E2E
    tasks:
      - id: E2E-001
        title: "Write hello function"
        priority: P1
        state: Backlog
        dependsOn: []
  pitfalls:
    entries: []

run:
  args: ["scripts/auto-pilot-loop.mjs"]
  flags: ["--no-colony", "--no-commit", "--no-parallel", "--max-cycles", "2", "--skip-sprint-review"]
  # Override config to make build fail
  extra_args: []

assert:
  must:
    - type: gate_passed
      gate: build
    - type: state_after
      task: E2E-001
      field: state
      value: Done
  should: []
