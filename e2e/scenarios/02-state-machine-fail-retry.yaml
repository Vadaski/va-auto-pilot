name: "State Machine: Fail and Retry (Backlog -> Failed -> Done)"
description: |
  Task fails on first attempt, then succeeds on second.
  Step 1: Agent fails, task goes to Failed state.
  Step 2: Agent succeeds, task recovers and reaches Done.

steps:
  - label: "agent fails on first attempt"
    setup:
      fixture: minimal-node
      agent_behavior: fail
      review_behavior: pass
      sprint_state:
        projectPrefix: E2E
        tasks:
          - id: E2E-001
            title: "Write hello function"
            priority: P1
            state: Backlog
            dependsOn: []
    run:
      args: ["scripts/auto-pilot-loop.mjs"]
      flags: ["--no-colony", "--no-commit", "--no-parallel", "--max-cycles", "1", "--skip-sprint-review"]
    assert:
      must:
        - type: exit_code
          value: 0
        - type: state_after
          task: E2E-001
          field: state
          value: Failed
        - type: task_field
          task: E2E-001
          field: failCount
          value: 1
      should: []

  - label: "agent succeeds on retry"
    setup:
      agent_behavior: pass
    run:
      args: ["scripts/auto-pilot-loop.mjs"]
      flags: ["--no-colony", "--no-commit", "--no-parallel", "--max-cycles", "5", "--skip-sprint-review"]
    assert:
      must:
        - type: exit_code
          value: 0
        - type: state_after
          task: E2E-001
          field: state
          value: Done
      should: []
