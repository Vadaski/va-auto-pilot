# Critical path: Mario 1-1 start to flagpole
#
# Tests the core game loop: launch → canvas renders → level loads → Mario
# moves right continuously → game remains responsive (no hang/crash).
#
# HOW TO CUSTOMIZE FOR YOUR MARIO IMPLEMENTATION
# -----------------------------------------------
# 1. launch.command   — replace with the actual start command (e.g. "npm run dev",
#                       "python -m http.server 3000", "npx serve .", etc.)
# 2. launch.url       — change port/path if the dev server uses a different address
# 3. launch.waitFor   — increase if your build step takes longer than 5 s
# 4. "Game canvas renders" selector — "canvas" works for most browser games;
#                       if yours uses a <div id="game"> wrapper, update accordingly
# 5. "Start game / begin level" key — replace "Enter" with whatever your game
#                       uses to dismiss the title screen and begin World 1-1
# 6. "Wait for level load" duration — tune to match your actual level-load time
# 7. "Mario moves right toward flagpole" holdMs — 15 000 ms (15 s) is generous
#                       for a short straight run; increase if the flagpole is further
# 8. hangDetection thresholds — lower maxSameFrames for a tighter hang budget

name: "Mario 1-1 to flagpole"

launch:
  # Command to start the game dev/static server.
  # Customize: replace with "npm run dev", "npx serve .", "python -m http.server", etc.
  command: "npm start"

  # URL Puppeteer navigates to after the server starts.
  # Customize: change port or path to match your server (e.g. "http://localhost:8080").
  url: "http://localhost:3000"

  # Milliseconds to wait after spawning the process before opening the browser.
  # Increase if your build or bundler takes longer to be ready.
  waitFor: 5000

steps:
  # ── Step 1: Verify the game canvas is present ────────────────────────────────
  # Most browser-based Mario clones render into a <canvas> element.
  # Customize: if your game uses a different root element (e.g. "#game-container",
  #            ".game-canvas", "div#app"), replace "canvas" with that selector.
  - name: "Game canvas renders"
    action: waitForSelector
    selector: "canvas"
    timeout: 10000      # 10 s — fail fast if the canvas never appears

  # ── Step 2: Dismiss title screen / start World 1-1 ───────────────────────────
  # Most Mario implementations start the game with Enter or Space on the title screen.
  # Customize: if your game uses a click on a "Play" button instead, switch to:
  #   action: click
  #   selector: "#play-btn"   (or whatever your start button selector is)
  - name: "Start game / begin level"
    action: keyboard
    key: "Enter"        # Common start key; try "Space" if Enter does not work
    holdMs: 100         # Brief press — enough to register without holding too long

  # ── Step 3: Allow the level to fully load ────────────────────────────────────
  # Wait for World 1-1 assets, tilemap, and sprites to finish loading.
  # Customize: tune `duration` to match your actual level-load time.
  - name: "Wait for level load"
    action: wait
    duration: 2000      # 2 s is enough for most bundled games; increase as needed

  # ── Step 4: Hold ArrowRight to run Mario toward the flagpole ─────────────────
  # Puppeteer holds the key down for `holdMs` ms, then releases it.
  # 15 000 ms (15 s) gives Mario enough time to reach the flagpole area in most
  # standard 1-1 implementations without needing to jump over enemies.
  # Customize: if your 1-1 is longer, or Mario needs to jump, also add a "Jump"
  #            step interleaved here (key: "ArrowUp" / key: "z" / key: "Space").
  - name: "Mario moves right toward flagpole"
    action: keyboard
    key: "ArrowRight"
    holdMs: 15000       # Hold right for 15 s — adjust for your level length

  # ── Step 5: Verify the game is still alive and responsive ────────────────────
  # Evaluates a JS expression in the page context and checks for a truthy result.
  # If the canvas is gone (crashed, replaced, or removed) this step fails.
  # Customize: replace the expression with something more game-specific, e.g.:
  #   "window.game && window.game.isRunning()"   (if your engine exposes a global)
  #   "document.querySelector('#score') !== null" (if there is a score element)
  - name: "Check game is still responsive"
    action: evaluate
    expression: "document.querySelector('canvas') !== null"

# ── Hang detection ─────────────────────────────────────────────────────────────
# Periodically compares full-page screenshots at the pixel level.
# If `maxSameFrames` consecutive screenshots are identical the test is marked hung.
#
# intervalMs × maxSameFrames = maximum tolerated freeze duration before hang is declared.
# Default here: 2 000 ms × 5 = 10 s freeze tolerance.
#
# Customize: lower maxSameFrames (e.g. 3) for stricter hang detection,
#            or raise it if your game has intentional freeze-frames (e.g. cutscenes).
hangDetection:
  enabled: true
  intervalMs: 2000      # Take a comparison screenshot every 2 s
  maxSameFrames: 5      # 5 identical frames in a row (= 10 s frozen) → hang
