        assert(state.tasks[0].state === 'Failed', 'destructive command did not fail the task');
        assert(JSON.stringify(payload).includes('dispatch-failed'), 'loop did not report dispatch failure');
        assert(JSON.stringify(payload).includes('Permission scope blocked worker command'), 'permission block reason missing from loop output');
        assert(events.includes('"permissionAction":"requires-opt-in"'), 'destructive command decision missing from event log');
