name: "Quality Gates: Build -> Review -> Acceptance Sequence"
description: |
  Verifies that all three quality gates execute in order:
  build first, then review, then acceptance.
  All gates pass.

setup:
  fixture: minimal-node
  agent_behavior: pass
  review_behavior: pass
  sprint_state:
    projectPrefix: E2E
    tasks:
      - id: E2E-001
        title: "Write hello function"
        priority: P1
        state: Backlog
        dependsOn: []
  pitfalls:
    entries: []

run:
  args: ["scripts/auto-pilot-loop.mjs"]
  flags: ["--no-colony", "--no-commit", "--no-parallel", "--max-cycles", "5", "--skip-sprint-review"]

assert:
  must:
    - type: exit_code
      value: 0
    - type: gate_passed
      gate: build
    - type: gate_passed
      gate: review
    - type: state_after
      task: E2E-001
      field: state
      value: Done
  should:
    - type: all_gates_passed
