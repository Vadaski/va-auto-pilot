name: Pitfall CLI
# CLI flows for the pitfall sub-command of sprint-board.mjs.
# All flows use isolated_pitfalls: true to avoid mutating the real pitfalls.json.

flows:
  - name: "pitfall: records new entry and prints PF-ID"
    command: "node"
    args:
      - "scripts/sprint-board.mjs"
      - "pitfall"
      - "--task"
      - "AP-001"
      - "--failure-type"
      - "gate"
      - "--attempted"
      - "ran npm run check:all"
      - "--hypothesis"
      - "missing env var caused lint failure"
    isolated_pitfalls: true
    assert:
      must:
        - exit_code: 0
        - stdout_contains: ["Pitfall recorded", "PF-"]
      should: []

  - name: "pitfall: records entry with optional missing-context"
    command: "node"
    args:
      - "scripts/sprint-board.mjs"
      - "pitfall"
      - "--task"
      - "AP-002"
      - "--failure-type"
      - "acceptance"
      - "--attempted"
      - "validate:distribution"
      - "--hypothesis"
      - "template file missing"
      - "--missing-context"
      - "new required file not added to validate-distribution.mjs"
    isolated_pitfalls: true
    assert:
      must:
        - exit_code: 0
        - stdout_contains: ["Pitfall recorded", "PF-"]
      should: []

  - name: "pitfall: rejects invalid failure-type"
    command: "node"
    args:
      - "scripts/sprint-board.mjs"
      - "pitfall"
      - "--task"
      - "AP-001"
      - "--failure-type"
      - "bogus"
      - "--attempted"
      - "something"
      - "--hypothesis"
      - "something else"
    isolated_pitfalls: true
    assert:
      must:
        - exit_code_nonzero: true
        - stderr_contains: ["Invalid --failure-type"]
      should: []

  - name: "pitfall: rejects missing required --task"
    command: "node"
    args:
      - "scripts/sprint-board.mjs"
      - "pitfall"
      - "--failure-type"
      - "gate"
      - "--attempted"
      - "something"
      - "--hypothesis"
      - "reason"
    isolated_pitfalls: true
    assert:
      must:
        - exit_code_nonzero: true
        - stderr_contains: ["Missing required option"]
      should: []

  - name: "pitfall --list: prints empty message when no entries"
    command: "node"
    args:
      - "scripts/sprint-board.mjs"
      - "pitfall"
      - "--list"
    isolated_pitfalls: true
    assert:
      must:
        - exit_code: 0
        - stdout_contains: ["No pitfall entries found."]
      should: []

  - name: "pitfall --list --json: returns parseable JSON array"
    command: "node"
    args:
      - "scripts/sprint-board.mjs"
      - "pitfall"
      - "--list"
      - "--json"
    isolated_pitfalls: true
    assert:
      must:
        - exit_code: 0
        - stdout_json_parseable: true
      should: []

  - name: "pitfall --resolve: rejects unknown PF-ID"
    command: "node"
    args:
      - "scripts/sprint-board.mjs"
      - "pitfall"
      - "--resolve"
      - "PF-999"
      - "--resolution"
      - "fixed it"
    isolated_pitfalls: true
    assert:
      must:
        - exit_code_nonzero: true
        - stderr_contains: ["Pitfall not found"]
      should: []

  - name: "pitfall --resolve: appends adaptive gate suggestion"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        mkdir -p "$tmpdir/.va-auto-pilot" "$tmpdir/docs/todo"
        git -C "$tmpdir" init -q
        git -C "$tmpdir" config user.name "VA Test"
        git -C "$tmpdir" config user.email "va-test@example.com"
        cat > "$tmpdir/.va-auto-pilot/pitfalls.json" <<'EOF'
        {
          "version": 1,
          "entries": [
            {
              "id": "PF-010",
              "taskId": "AP-010",
              "failureType": "gate",
              "attempted": "npm run build",
              "hypothesis": "build check should become a persistent gate",
              "missingContext": "",
              "resolution": "",
              "resolvedAt": null,
              "createdAt": "2026-03-31T00:00:00.000Z"
            }
          ]
        }
        EOF
        cat > "$tmpdir/.va-auto-pilot/config.yaml" <<'EOF'
        qualityGate:
          buildCommand: "npm run build"
        EOF
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {
          "projectPrefix": "AP",
          "updatedAt": "2026-03-31T00:00:00.000Z",
          "tasks": [
            {
              "id": "AP-010",
              "title": "Guard build validation with a persistent gate",
              "priority": "P1",
              "state": "In Progress",
              "failCount": 0,
              "dependsOn": []
            }
          ]
        }
        EOF
        cat > "$tmpdir/docs/todo/run-journal.md" <<'EOF'
        # Run Journal

        ## Entries
        EOF
        git -C "$tmpdir" add .
        git -C "$tmpdir" commit -m "chore(test): init" >/dev/null
        (
          cd "$tmpdir"
          node /Users/vadaski/vadaski/Code/va-auto-pilot/scripts/sprint-board.mjs pitfall --resolve PF-010 --resolution "made build gate permanent" --pitfalls-file "$tmpdir/.va-auto-pilot/pitfalls.json" --journal-file "$tmpdir/docs/todo/run-journal.md"
        )
        cat "$tmpdir/.va-auto-pilot/config.yaml"
        printf '\n---\n'
        cat "$tmpdir/.va-auto-pilot/constraints/pf-010.yaml"
        printf '\n---\n'
        cat "$tmpdir/docs/todo/run-journal.md"
        printf '\n---\n'
        git -C "$tmpdir" log -1 --pretty=%s
    assert:
      must:
        - exit_code: 0
        - stdout_contains:
            - "Pitfall resolved: PF-010"
            - ".va-auto-pilot/constraints/pf-010.yaml"
            - "adaptiveGates:"
            - "type: auto-pilot-constraint-set"
            - "triggeredBy: PF-010"
            - "Resolved pitfall PF-010. Suggested gate appended:"
            - "constraint: Guard build validation with a persistent gate"
      should: []

  - name: "update --state Failed with failure-type: records failureDetail"
    command: "node"
    args:
      - "scripts/sprint-board.mjs"
      - "update"
      - "--id"
      - "AP-004"
      - "--state"
      - "Failed"
      - "--failure-type"
      - "acceptance"
      - "--attempted"
      - "ran validate:distribution"
      - "--hypothesis"
      - "missing pitfalls.json"
    isolated_state: true
    assert:
      must:
        - exit_code: 0
        - stdout_contains: ["Task updated", "Failed"]
      should: []

  - name: "update --state Failed with invalid failure-type: rejects"
    command: "node"
    args:
      - "scripts/sprint-board.mjs"
      - "update"
      - "--id"
      - "AP-004"
      - "--state"
      - "Failed"
      - "--failure-type"
      - "invalid"
    isolated_state: true
    assert:
      must:
        - exit_code_nonzero: true
        - stderr_contains: ["Invalid --failure-type"]
      should: []

  - name: "suggest-gate: outputs YAML suggestions from unresolved pitfalls"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        pitfalls="$tmpdir/pitfalls.json"
        cat > "$tmpdir/package.json" <<'EOF'
        {
          "name": "fixture",
          "packageManager": "pnpm@10.0.0",
          "scripts": {
            "test:unit": "vitest run"
          }
        }
        EOF
        cat > "$pitfalls" <<'EOF'
        {
          "version": 1,
          "entries": [
            {
              "id": "PF-001",
              "taskId": "AP-001",
              "failureType": "gate",
              "attempted": "npm test",
              "hypothesis": "tests failed because coverage gate is missing",
              "missingContext": "",
              "resolution": "",
              "resolvedAt": null,
              "createdAt": "2026-03-29T00:00:00.000Z"
            }
          ]
        }
        EOF
        (
          cd "$tmpdir"
          node /Users/vadaski/vadaski/Code/va-auto-pilot/scripts/sprint-board.mjs suggest-gate --pitfalls-file "$pitfalls"
        )
    assert:
      must:
        - exit_code: 0
        - stdout_contains:
            - "triggeredBy: PF-001"
            - "command: pnpm run test:unit"
            - "required: true"
      should: []

  - name: "suggest-gate: infers test command from target package.json"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        cat > "$tmpdir/package.json" <<'EOF'
        {
          "name": "fixture",
          "packageManager": "pnpm@10.0.0",
          "scripts": {
            "test:unit": "vitest run"
          }
        }
        EOF
        cat > "$tmpdir/pitfalls.json" <<'EOF'
        {
          "version": 1,
          "entries": [
            {
              "id": "PF-003",
              "taskId": "AP-003",
              "failureType": "gate",
              "attempted": "tests failed during verification",
              "hypothesis": "a persistent test gate is missing",
              "missingContext": "",
              "resolution": "",
              "resolvedAt": null,
              "createdAt": "2026-03-29T00:00:00.000Z"
            }
          ]
        }
        EOF
        (
          cd "$tmpdir"
          node /Users/vadaski/vadaski/Code/va-auto-pilot/scripts/sprint-board.mjs suggest-gate --pitfalls-file "$tmpdir/pitfalls.json"
        )
    assert:
      must:
        - exit_code: 0
        - stdout_contains:
            - "triggeredBy: PF-003"
            - "command: pnpm run test:unit"
            - "required: true"
      should: []

  - name: "suggest-gate: prefers discovered project test script over acceptance script"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        cat > "$tmpdir/package.json" <<'EOF'
        {
          "name": "fixture",
          "scripts": {
            "check:units": "node ./scripts/test-units.mjs",
            "validate:distribution": "node ./scripts/validate-distribution.mjs"
          }
        }
        EOF
        cat > "$tmpdir/pitfalls.json" <<'EOF'
        {
          "version": 1,
          "entries": [
            {
              "id": "PF-003B",
              "taskId": "AP-003",
              "failureType": "gate",
              "attempted": "npm test",
              "hypothesis": "a persistent test gate is missing",
              "missingContext": "",
              "resolution": "",
              "resolvedAt": null,
              "createdAt": "2026-03-29T00:00:00.000Z"
            }
          ]
        }
        EOF
        (
          cd "$tmpdir"
          node /Users/vadaski/vadaski/Code/va-auto-pilot/scripts/sprint-board.mjs suggest-gate --pitfalls-file "$tmpdir/pitfalls.json"
        )
    assert:
      must:
        - exit_code: 0
        - stdout_contains:
            - "triggeredBy: PF-003B"
            - "command: npm run check:units"
            - "required: true"
      should: []

  - name: "suggest-gate: resolves project stack from pitfalls file path outside cwd"
    command: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        project_dir="$(mktemp -d)"
        outside_dir="$(mktemp -d)"
        mkdir -p "$project_dir/.va-auto-pilot"
        cat > "$project_dir/Cargo.toml" <<'EOF'
        [package]
        name = "fixture"
        version = "0.1.0"
        edition = "2021"
        EOF
        cat > "$project_dir/.va-auto-pilot/pitfalls.json" <<'EOF'
        {
          "version": 1,
          "entries": [
            {
              "id": "PF-004",
              "taskId": "AP-004",
              "failureType": "gate",
              "attempted": "tests failed during verification",
              "hypothesis": "acceptance gate is missing",
              "missingContext": "",
              "resolution": "",
              "resolvedAt": null,
              "createdAt": "2026-04-14T00:00:00.000Z"
            }
          ]
        }
        EOF
        (
          cd "$outside_dir"
          node /Users/vadaski/vadaski/Code/va-auto-pilot/scripts/sprint-board.mjs suggest-gate --pitfalls-file "$project_dir/.va-auto-pilot/pitfalls.json"
        )
    assert:
      must:
        - exit_code: 0
        - stdout_contains:
            - "triggeredBy: PF-004"
            - "command: cargo test"
            - "required: true"
      should: []
