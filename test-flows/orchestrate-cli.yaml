          acceptanceTestCommand: test -f AP-001.txt -o -f AP-002.txt
          planReviewCommand: "/bin/echo WARNING: dogfood-plan-reviewed"
        EOF
        cat > "$tmpdir/.va-auto-pilot/sprint-state.json" <<'EOF'
        {"projectPrefix":"AP","tasks":[{"id":"AP-001","title":"Commit failure artifact","priority":"P0","state":"Backlog","owner":"","source":"commit-failure-fixture","createdAt":"2026-07-01","startedAt":"","completedAt":"","lastFailedAt":"","failCount":0,"reason":"","verification":"","notes":"","review":{},"testing":{},"dependsOn":[]},{"id":"AP-002","title":"Do not commit after failure","priority":"P0","state":"Backlog","owner":"","source":"commit-failure-fixture","createdAt":"2026-07-02","startedAt":"","completedAt":"","lastFailedAt":"","failCount":0,"reason":"","verification":"","notes":"","review":{},"testing":{},"dependsOn":[]}]}
        EOF
        cat > "$tmpdir/docs/todo/human-board.md" <<'EOF'
        # Human Board

        ## Instructions

        EOF
        cat > "$tmpdir/docs/todo/run-journal.md" <<'EOF'
        # Run Journal

        EOF
        repo="$(cd "$ROOT" && pwd)"
        cd "$tmpdir"
        node "$repo/scripts/sprint-board.mjs" render >/dev/null
        git init -q
        git config user.email dogfood@example.invalid
        git config user.name "VA Auto-Pilot Dogfood"
        git add .
        git commit -q -m "chore: seed commit failure fixture"

        node "$repo/scripts/auto-pilot.mjs" orchestrate init --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate plan --max-parallel 1 --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate review-plan --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate approve-plan --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate dispatch --json >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate await-workers --no-colony --agent-template "node $repo/e2e/stubs/deterministic-agent.mjs" >/dev/null
        node "$repo/scripts/auto-pilot.mjs" orchestrate approve-commit --tasks AP-001,AP-002 --json >/dev/null

        cat > .git/hooks/pre-commit <<'EOF'
        #!/bin/sh
        echo forced commit failure >&2
        exit 1
        EOF
        chmod +x .git/hooks/pre-commit
        set +e
        node "$repo/scripts/auto-pilot.mjs" orchestrate commit --json > "$evidence/commit-fail.json" 2> "$evidence/commit-fail.err"
        commit_status=$?
        node "$repo/scripts/auto-pilot.mjs" orchestrate commit --json > "$evidence/second-commit.json" 2> "$evidence/second-commit.err"
        second_status=$?
        set -e
        test "$commit_status" -ne 0
        test "$second_status" -ne 0
        grep -q APPROVAL_REQUIRED "$evidence/second-commit.err"

        node - <<'NODE' "$evidence" "$tmpdir"
        const fs = require('fs');
        const path = require('path');
        const evidence = process.argv[2];
        const tmpdir = process.argv[3];
        const failed = JSON.parse(fs.readFileSync(path.join(evidence, 'commit-fail.json'), 'utf8'));
        const run = JSON.parse(fs.readFileSync(path.join(tmpdir, '.va-auto-pilot/orchestration/run.json'), 'utf8'));
        const state = JSON.parse(fs.readFileSync(path.join(tmpdir, '.va-auto-pilot/sprint-state.json'), 'utf8'));
        const assert = (condition, message) => { if (!condition) throw new Error(message); };
        assert(failed.ok === false, 'first commit failure did not report ok=false');
        assert(failed.phase === 'awaiting-commit-approval', 'commit failure did not return to approval phase');
        assert(failed.commits.length === 1 && failed.commits[0].taskId === 'AP-001', 'commit continued after the first failed task');
        assert(Array.isArray(run.approvedCommitTasks) && run.approvedCommitTasks.length === 0, 'stale approvedCommitTasks were not cleared');
        assert(state.tasks.find((task) => task.id === 'AP-001').state === 'Failed', 'failed commit did not roll task back to Failed');
        assert(state.tasks.find((task) => task.id === 'AP-002').state === 'Done', 'unattempted task should remain Done for fresh approval');
        NODE
    env:
      ROOT: "."
    assert:
      must:
        - exit_code: 0
      should: []

